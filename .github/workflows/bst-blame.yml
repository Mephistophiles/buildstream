name: bst-blame
on:
  push:
    paths: ['contrib/bst-blame/**', '.github/workflows/bst-blame.yml']
  pull_request:
    paths: ['contrib/bst-blame/**', '.github/workflows/bst-blame.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python -m pip install './contrib/bst-blame[test,live]' 'BuildStream==2.8.0'
      - run: python -m pytest -c contrib/bst-blame/pyproject.toml contrib/bst-blame/tests
        env:
          BST_BLAME_TEST_LIVE: "1"
