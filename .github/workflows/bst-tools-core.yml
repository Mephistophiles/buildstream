name: bst-tools-core
on:
  push:
    paths: ['contrib/bst-tools-core/**', 'contrib/bst-tree/**', 'contrib/bst-diff/**', 'contrib/bst-elf/**', 'contrib/bst-blame/**', 'contrib/bst-grep/**', 'contrib/bst-cas/**', '.github/workflows/bst-tools-core.yml']
  pull_request:
    paths: ['contrib/bst-tools-core/**', 'contrib/bst-tree/**', 'contrib/bst-diff/**', 'contrib/bst-elf/**', 'contrib/bst-blame/**', 'contrib/bst-grep/**', 'contrib/bst-cas/**', '.github/workflows/bst-tools-core.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install './contrib/bst-tools-core[test]'
      - run: python -m pytest -c contrib/bst-tools-core/pyproject.toml contrib/bst-tools-core/tests
  headless:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Install base packages without TUI dependencies
        run: python -m pip install ./contrib/bst-tools-core ./contrib/bst-tree ./contrib/bst-diff
      - name: Exercise offline file diff, graph diff, graph queries and archive sizes
        run: python contrib/bst-tools-core/tests/headless_smoke.py
