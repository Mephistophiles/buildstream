name: bst-tools-core
on:
  push:
    paths: ['contrib/install-bst-tools.sh', 'contrib/bst-tools-core/**', 'contrib/bst-tree/**', 'contrib/bst-diff/**', 'contrib/bst-elf/**', 'contrib/bst-blame/**', 'contrib/bst-grep/**', 'contrib/bst-cas/**', '.github/workflows/bst-tools-core.yml']
  pull_request:
    paths: ['contrib/install-bst-tools.sh', 'contrib/bst-tools-core/**', 'contrib/bst-tree/**', 'contrib/bst-diff/**', 'contrib/bst-elf/**', 'contrib/bst-blame/**', 'contrib/bst-grep/**', 'contrib/bst-cas/**', '.github/workflows/bst-tools-core.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install './contrib/bst-tools-core[test]'
      - run: python -m pytest -c contrib/bst-tools-core/pyproject.toml contrib/bst-tools-core/tests
  headless:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Install base packages without TUI dependencies
        run: python -m pip install ./contrib/bst-tools-core ./contrib/bst-tree ./contrib/bst-diff
      - name: Exercise offline file diff, graph diff, graph queries and archive sizes
        run: python contrib/bst-tools-core/tests/headless_smoke.py
  pipx-install:
    runs-on: ubuntu-latest
    env:
      PIPX_HOME: ${{ runner.temp }}/bst-tools-pipx
      PIPX_BIN_DIR: ${{ runner.temp }}/bst-tools-bin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pipx with legacy package-name discovery
        run: python -m pip install 'pipx==1.4.3'
      - name: Install and update the tool suite
        run: |
          ./contrib/install-bst-tools.sh
          ./contrib/install-bst-tools.sh --force
      - name: Check entry points and dependencies
        run: |
          for tool in bst-cas bst-tree bst-diff bst-elf bst-blame bst-grep; do
            "$PIPX_BIN_DIR/$tool" --help >/dev/null
          done
          pipx runpip bst-cas check
