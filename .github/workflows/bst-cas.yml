name: bst-cas
on:
  push:
    paths: ['contrib/bst-tools-core/**', 'contrib/bst-cas/**', 'contrib/bst-elf/**', 'contrib/bst-blame/**', 'contrib/bst-grep/**', 'contrib/bst-tree/**', '.github/workflows/bst-cas.yml']
  pull_request:
    paths: ['contrib/bst-tools-core/**', 'contrib/bst-cas/**', 'contrib/bst-elf/**', 'contrib/bst-blame/**', 'contrib/bst-grep/**', 'contrib/bst-tree/**', '.github/workflows/bst-cas.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap gcc ripgrep
      - run: python -m pip install './contrib/bst-tools-core' './contrib/bst-cas[test]' './contrib/bst-elf[test]' './contrib/bst-blame[test]' './contrib/bst-grep[test]' './contrib/bst-tree[test,tui]' 'BuildStream==2.8.0'
      - name: Shared index, consumers, and real BuildStream CAS
        run: python -m pytest -c contrib/bst-cas/pyproject.toml contrib/bst-cas/tests
        env:
          BST_CAS_TEST_LIVE: "1"
      - name: Independent consumer regression suites
        run: |
          python -m pytest -c contrib/bst-elf/pyproject.toml contrib/bst-elf/tests
          python -m pytest -c contrib/bst-blame/pyproject.toml contrib/bst-blame/tests
          python -m pytest -c contrib/bst-grep/pyproject.toml contrib/bst-grep/tests
          python -m pytest -c contrib/bst-tree/pyproject.toml contrib/bst-tree/tests
