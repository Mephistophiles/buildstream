name: bst-grep
on:
  push:
    paths: ['contrib/bst-grep/**', '.github/workflows/bst-grep.yml']
  pull_request:
    paths: ['contrib/bst-grep/**', '.github/workflows/bst-grep.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: python -m pip install './contrib/bst-grep[test]' 'BuildStream==2.8.0'
      - run: python -m pytest -c contrib/bst-grep/pyproject.toml contrib/bst-grep/tests
        env:
          BST_GREP_TEST_LIVE: "1"
