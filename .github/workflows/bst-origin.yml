name: bst-origin
on:
  push:
    paths: ['contrib/bst-tools-core/**', 'contrib/bst-tree/**', 'src/buildstream/_input_provenance.py', 'src/buildstream/element.py', 'src/buildstream/_context.py', 'src/buildstream/_frontend/cli.py', 'src/buildstream/_frontend/app.py', '.github/workflows/bst-origin.yml']
  pull_request:
    paths: ['contrib/bst-tools-core/**', 'contrib/bst-tree/**', 'src/buildstream/_input_provenance.py', 'src/buildstream/element.py', 'src/buildstream/_context.py', 'src/buildstream/_frontend/cli.py', 'src/buildstream/_frontend/app.py', '.github/workflows/bst-origin.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - run: python -m pip install './contrib/bst-tools-core' './contrib/bst-tree[test,tui]' 'BuildStream==2.8.0'
      - name: Test fork Python changes against the released compiled runtime
        run: |
          python - <<'PY'
          import buildstream
          from pathlib import Path
          import shutil
          destination = Path(buildstream.__file__).parent
          for name in ('_input_provenance.py', 'element.py', '_context.py', '_frontend/cli.py', '_frontend/app.py'):
              shutil.copyfile(Path('src/buildstream') / name, destination / name)
          PY
      - run: python -m pytest -c contrib/bst-tree/pyproject.toml contrib/bst-tree/tests/test_origin.py contrib/bst-tree/tests/test_origin_live.py
        env:
          BST_TREE_TEST_ORIGIN: "1"
