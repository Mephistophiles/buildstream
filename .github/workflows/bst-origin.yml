name: bst-origin
on:
  push:
    paths: ['contrib/bst-tools-core/**', 'contrib/bst-tree/**', 'src/buildstream/node.pyx', 'src/buildstream/_composition_history.py', 'src/buildstream/_options/optionpool.py', 'src/buildstream/_input_provenance.py', 'src/buildstream/element.py', 'src/buildstream/_context.py', 'src/buildstream/_frontend/cli.py', 'src/buildstream/_frontend/app.py', '.github/workflows/bst-origin.yml']
  pull_request:
    paths: ['contrib/bst-tools-core/**', 'contrib/bst-tree/**', 'src/buildstream/node.pyx', 'src/buildstream/_composition_history.py', 'src/buildstream/_options/optionpool.py', 'src/buildstream/_input_provenance.py', 'src/buildstream/element.py', 'src/buildstream/_context.py', 'src/buildstream/_frontend/cli.py', 'src/buildstream/_frontend/app.py', '.github/workflows/bst-origin.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap gcc
      - run: python -m pip install './contrib/bst-tools-core' './contrib/bst-tree[test,tui]' 'BuildStream==2.8.0' 'Cython>=3.1' setuptools pytest-datafiles
      - name: Compile fork node extension and overlay fork Python modules
        run: |
          python contrib/bst-tree/tests/build_origin_runtime.py "$RUNNER_TEMP/bst-origin-runtime"
          echo "PYTHONPATH=$RUNNER_TEMP/bst-origin-runtime" >> "$GITHUB_ENV"
      - run: python -m pytest -c contrib/bst-tree/pyproject.toml contrib/bst-tree/tests/test_origin.py contrib/bst-tree/tests/test_origin_live.py contrib/bst-tree/tests/test_origin_history.py
        env:
          BST_TREE_TEST_ORIGIN: "1"
      - name: Existing native YAML regression suite without history enabled
        run: python -m pytest -c contrib/bst-tree/pyproject.toml --basetemp "$RUNNER_TEMP/bst-origin-yaml-tests" tests/internals/yaml.py
