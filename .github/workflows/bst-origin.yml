name: bst-origin
on:
  push:
    paths: ['contrib/bst-tools-core/**', 'contrib/bst-tree/**', 'tests/conftest.py', 'src/buildstream/node.pyx', 'src/buildstream/_composition_history.py', 'src/buildstream/_options/optionpool.py', 'src/buildstream/_input_provenance.py', 'src/buildstream/element.py', 'src/buildstream/_context.py', 'src/buildstream/_frontend/cli.py', 'src/buildstream/_frontend/app.py', '.github/workflows/bst-origin.yml']
  pull_request:
    paths: ['contrib/bst-tools-core/**', 'contrib/bst-tree/**', 'tests/conftest.py', 'src/buildstream/node.pyx', 'src/buildstream/_composition_history.py', 'src/buildstream/_options/optionpool.py', 'src/buildstream/_input_provenance.py', 'src/buildstream/element.py', 'src/buildstream/_context.py', 'src/buildstream/_frontend/cli.py', 'src/buildstream/_frontend/app.py', '.github/workflows/bst-origin.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap gcc
      - run: python -m pip install './contrib/bst-tools-core' './contrib/bst-tree[test,tui]' 'BuildStream==2.8.0' 'Cython>=3.1' setuptools pytest-datafiles
      - name: Install the private provenance backend
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/bst-tree-data"
          # Reproduce an old venv whose base interpreter was removed.
          runtime="$XDG_DATA_HOME/bst-tree/provenance"
          mkdir -p "$runtime/venv/bin"
          ln -s "$RUNNER_TEMP/removed-python3" "$runtime/venv/bin/python3"
          ln -s python3 "$runtime/venv/bin/python"
          ./contrib/bst-tree/install-provenance.sh
          backups=("$runtime"/venv-backup.*)
          test -L "${backups[0]}/venv/bin/python3"
          echo "XDG_DATA_HOME=$XDG_DATA_HOME" >> "$GITHUB_ENV"
          # Native regression tests import the fork directly in the pytest process.
          overlays=("$XDG_DATA_HOME"/bst-tree/provenance/overlay.*)
          echo "PYTHONPATH=${overlays[0]}" >> "$GITHUB_ENV"
      - run: python -m pytest -c contrib/bst-tree/pyproject.toml contrib/bst-tree/tests/test_origin.py contrib/bst-tree/tests/test_origin_live.py contrib/bst-tree/tests/test_origin_history.py contrib/bst-tree/tests/test_input_diff.py
        env:
          BST_TREE_TEST_ORIGIN: "1"
          BST_TREE_TEST_PRIVATE: "1"
      - name: Existing native YAML regression suite without history enabled
        run: python -m pytest -c contrib/bst-tree/pyproject.toml --basetemp "$RUNNER_TEMP/bst-origin-yaml-tests" tests/internals/yaml.py
