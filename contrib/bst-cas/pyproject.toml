[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bst-cas"
version = "0.1.0"
description = "Shared read-only BuildStream CAS inventory and content analysis cache"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["protobuf>=4.25", "ruamel.yaml>=0.18"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bst-cas = "bst_cas.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
