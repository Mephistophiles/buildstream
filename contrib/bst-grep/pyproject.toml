[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bst-grep"
version = "0.1.0"
description = "Search BuildStream sources and resolved configuration with element provenance"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["bst-tools-core>=0.1,<0.2"]

[project.optional-dependencies]
cas = ["bst-cas>=0.1,<0.2"]
test = ["pytest>=8"]
live = ["BuildStream>=2.8", "buildstream-plugins>=2"]

[project.scripts]
bst-grep = "bst_grep.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
