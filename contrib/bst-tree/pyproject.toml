[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bst-tree"
version = "0.1.0"
description = "Explore and compare BuildStream dependency graphs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["bst-tools-core>=0.1,<0.2"]

[project.optional-dependencies]
tui = ["textual>=8.2,<9", "bst-tools-core[tui]>=0.1,<0.2"]
cas = ["bst-cas>=0.1,<0.2"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
bst-tree = "bst_tree.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
