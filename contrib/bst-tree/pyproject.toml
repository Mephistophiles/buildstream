[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bst-tree"
version = "0.1.0"
description = "Explore and compare BuildStream dependency graphs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["bst-tools-core>=0.1,<0.2"]

[project.optional-dependencies]
tui = ["textual>=8.2,<9", "bst-tools-core[tui]>=0.1,<0.2"]
cas = ["bst-cas>=0.1,<0.2"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
bst-tree = "bst_tree.cli:main"
bst-snapshot = "bst_tree.snapshot:main"
bst-graph-diff = "bst_tree.diff_cli:graph_main"
bst-closure-diff = "bst_tree.diff_cli:closure_main"
bst-key-explain = "bst_tree.diff_cli:explain_main"
bst-rdeps = "bst_tree.headless:main_rdeps"
bst-path = "bst_tree.headless:main_path"
bst-paths = "bst_tree.headless:main_paths"
bst-chains = "bst_tree.headless:main_chains"
bst-rebuild-select = "bst_tree.headless:main_rebuild"
bst-inputs = "bst_tree.headless_inspection:main_inputs"
bst-source-files = "bst_tree.headless_inspection:main_source_files"
bst-artifact-files = "bst_tree.headless_inspection:main_artifact_files"
bst-origin = "bst_tree.origin:main"
bst-du = "bst_tree.size:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
