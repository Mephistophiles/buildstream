[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bst-tree"
version = "0.1.0"
description = "Explore and compare BuildStream dependency graphs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["ruamel.yaml>=0.16.7", "textual>=8.2,<9"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
bst-tree = "bst_tree.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
