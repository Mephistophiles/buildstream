[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bst-elf"
version = "0.1.0"
description = "Inspect ELF dependencies and their BuildStream artifact owners without executing target code"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["ruamel.yaml>=0.16.7", "pyelftools>=0.32,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]
live = ["BuildStream>=2.8"]

[project.scripts]
bst-elf = "bst_elf.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
