[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bst-mc"
version = "0.1.0"
description = "Browse BuildStream projects in Midnight Commander"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["bst-tree>=0.1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bst-mc = "bst_mc.cli:main"
bstmc = "bst_mc.vfs:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
